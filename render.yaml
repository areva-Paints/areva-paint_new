# One Node Web Service serves the website, admin, warranty pages and APIs.
# Private JSON and receipt files require the persistent disk below.
services:
  - type: web
    name: areva-paint-new
    runtime: node
    plan: starter
    # Compile with build tools, then keep only production dependencies at runtime.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    # Keep one instance/process: local JSON stores and in-memory sessions are not shared.
    disk:
      name: areva-content
      mountPath: /var/data/areva
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CONTENT_DATA_DIR
        value: /var/data/areva
      - key: ADMIN_USERNAME
        value: admin
      # Enter the secret in Render; never commit a real admin password.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TEST_LOGIN
        value: "false"
      - key: PUBLIC_SITE_ORIGINS
        value: https://areva-paint-new.onrender.com,https://areva-paint-new-admin.onrender.com
      - key: UPLOAD_STORAGE_MB
        value: "512"
      - key: WARRANTY_OTP_MODE
        value: "demo"
      - key: WARRANTY_STORAGE_MB
        value: "128"
