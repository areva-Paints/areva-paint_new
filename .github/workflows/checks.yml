# Validate the maintained source without changing hosted services or databases.
name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify generated SQL matches its source
        run: node scripts/prepare_supabase_sql.cjs --check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit build and test dependencies
        run: npm audit --audit-level=moderate
      - name: Verify the pruned production runtime
        run: |
          npm prune --omit=dev
          npm run check:production
