# Validate the maintained source without changing hosted services or databases.
name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # No patched picomatch release exists yet; keep the full-tree finding visible.
      # Production dependencies remain a blocking audit gate above.
      - name: Report build and test dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Verify the pruned production runtime
        run: |
          npm prune --omit=dev
          npm run check:production
